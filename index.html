<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineMoov - المنصة السينمائية الاحترافية</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Header للهواتف -->
    <header class="mobile-header">
        <div class="logo">
            <i class="fas fa-film"></i> <span>CineMoov</span>
        </div>
        <button id="menuToggleBtn" class="menu-toggle-btn">
            <i class="fas fa-bars"></i>
        </button>
    </header>

    <div class="app-layout">
        <!-- القائمة الجانبية Navigation -->
        <aside class="sidebar" id="sidebar">
            <div class="logo desktop-only">
                <i class="fas fa-film"></i> <span>CineMoov</span>
            </div>
            
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="ابحث عن فيلم، مسلسل، أنمي...">
            </div>

            <nav class="nav-menu">
                <a href="#" class="nav-item active" data-type="home"><i class="fas fa-home"></i> الرئيسية</a>
                <a href="#" class="nav-item" data-type="movie"><i class="fas fa-compact-disc"></i> الأفلام</a>
                <a href="#" class="nav-item" data-type="tv"><i class="fas fa-tv"></i> المسلسلات</a>
                <a href="#" class="nav-item" data-type="anime"><i class="fas fa-mask"></i> الأنمي</a>
            </nav>
        </aside>

        <!-- الخلفية المظلمة للهاتف عند فتح القائمة -->
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <!-- مساحة العرض الرئيسية -->
        <main class="main-content">
            
            <!-- HOME VIEW -->
            <div id="homeView">
                <!-- البانر الرئيسي Hero Banner -->
                <div id="heroBanner" class="hero-banner">
                    <div class="hero-overlay"></div>
                    <div class="hero-info">
                        <span class="hero-badge"><i class="fas fa-fire"></i> الأبرز هذا الأسبوع</span>
                        <h1 id="heroTitle">جاري التحميل...</h1>
                        <p id="heroOverview"></p>
                        <div class="hero-buttons">
                            <button id="heroPlayBtn" class="btn btn-primary"><i class="fas fa-play"></i> شاهد الآن</button>
                        </div>
                    </div>
                </div>

                <div class="sections-container">
                    <!-- قسم متابعة المشاهدة -->
                    <section class="content-section" id="continueWatchingSection" style="display: none;">
                        <div class="section-header">
                            <h2><i class="fas fa-history"></i> متابعة المشاهدة</h2>
                        </div>
                        <div class="horizontal-scroll" id="continueWatchingGrid"></div>
                    </section>

                    <!-- الأفلام الرائجة -->
                    <section class="content-section">
                        <div class="section-header">
                            <h2><i class="fas fa-compact-disc"></i> الأفلام الأكثر شهرة</h2>
                            <button class="see-more-btn" data-type="movie">عرض الكل <i class="fas fa-chevron-left"></i></button>
                        </div>
                        <div class="horizontal-scroll" id="rowTrendingMovies"></div>
                    </section>

                    <!-- المسلسلات الرائجة -->
                    <section class="content-section">
                        <div class="section-header">
                            <h2><i class="fas fa-tv"></i> المسلسلات الأكثر شهرة</h2>
                            <button class="see-more-btn" data-type="tv">عرض الكل <i class="fas fa-chevron-left"></i></button>
                        </div>
                        <div class="horizontal-scroll" id="rowTrendingTV"></div>
                    </section>

                    <!-- الأعلى تقييماً -->
                    <section class="content-section">
                        <div class="section-header">
                            <h2><i class="fas fa-crown"></i> الأعلى تقييماً</h2>
                            <button class="see-more-btn" data-type="top_rated">عرض الكل <i class="fas fa-chevron-left"></i></button>
                        </div>
                        <div class="horizontal-scroll" id="rowTopRated"></div>
                    </section>
                </div>
            </div>

            <!-- GRID / CATEGORY / SEARCH VIEW -->
            <div id="gridView" class="sections-container" style="display: none;">
                <div class="section-header" style="margin-bottom: 25px;">
                    <h2 id="gridTitle">الأفلام</h2>
                </div>
                <div class="media-grid" id="fullGrid"></div>
            </div>

            <!-- DETAIL & PLAYER VIEW -->
            <div id="detailView" class="detail-page" style="display: none;">
                <button id="backBtn" class="back-btn"><i class="fas fa-arrow-right"></i> العودة للرئيسية</button>
                
                <div class="detail-header" id="detailHeader">
                    <div class="detail-header-overlay"></div>
                    <div class="detail-header-content">
                        <img id="detailPoster" src="" alt="Poster" class="detail-poster">
                        <div class="detail-meta">
                            <h1 id="detailTitle">العنوان</h1>
                            <p id="detailOverview" class="detail-overview"></p>
                        </div>
                    </div>
                </div>

                <!-- مشغل الفيديو والتحكم -->
                <div class="player-wrapper">
                    <div class="video-container">
                        <iframe id="videoPlayer" src="" frameborder="0" allowfullscreen></iframe>
                    </div>

                    <!-- لوحة خيارات السيرفر والحلقات -->
                    <div class="player-controls-panel">
                        <h3><i class="fas fa-server"></i> اختر سيرفر المشاهدة</h3>
                        <div class="server-grid">
                            <button class="server-btn active" data-server="vidsrc">سيرفر 1 (أساسي)</button>
                            <button class="server-btn" data-server="superembed">سيرفر 2 (سريع HD)</button>
                            <button class="server-btn" data-server="autoembed">سيرفر 3 (بديل)</button>
                            <button class="server-btn" data-server="2embed">سيرفر 4 (احتياطي)</button>
                        </div>

                        <div id="tvControls" class="tv-controls" style="display: none;">
                            <h3><i class="fas fa-list"></i> قائمة الحلقات</h3>
                            <div class="control-group">
                                <label style="font-size:13px; color:#aaa; margin-bottom: 5px; display:block;">الموسم:</label>
                                <select id="seasonSelect"></select>
                            </div>
                            <div class="episodes-grid" id="episodesList"></div>
                        </div>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
