<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineMoov - سينيموف</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="app-layout">
        <!-- القائمة الجانبية -->
        <aside class="sidebar">
            <div class="logo">
                <i class="fas fa-film"></i> <span>CineMoov</span>
            </div>
            
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="بحث عن فيلم أو مسلسل...">
            </div>

            <nav class="nav-menu">
                <a href="#" class="nav-item active" data-type="home"><i class="fas fa-home"></i> الرئيسية</a>
                <a href="#" class="nav-item" data-type="movie"><i class="fas fa-compact-disc"></i> الأفلام</a>
                <a href="#" class="nav-item" data-type="tv"><i class="fas fa-tv"></i> المسلسلات</a>
                <a href="#" class="nav-item" data-type="anime"><i class="fas fa-mask"></i> الأنمي</a>
            </nav>
        </aside>

        <!-- المحتوى الرئيسي -->
        <main class="main-content">
            
            <!-- البنر الرئيسي -->
            <div id="heroBanner" class="hero-banner">
                <div class="hero-overlay"></div>
                <div class="hero-info">
                    <h1 id="heroTitle">جاري التحميل...</h1>
                    <p id="heroOverview"></p>
                    <div class="hero-buttons">
                        <button id="heroPlayBtn" class="btn btn-primary"><i class="fas fa-play"></i> تشغيل الآن</button>
                    </div>
                </div>
            </div>

            <div class="sections-container" id="sectionsContainer">
                
                <!-- قسم تابع المشاهدة -->
                <section class="content-section" id="continueWatchingSection" style="display: none;">
                    <h2><i class="fas fa-history"></i> تابع المشاهدة</h2>
                    <div class="horizontal-scroll" id="continueWatchingGrid"></div>
                </section>

                <!-- الصفوف المنظمة في الصفحة الرئيسية -->
                <div id="homeSections">
                    <!-- صف الأفلام الرائجة -->
                    <section class="content-section">
                        <div class="section-header">
                            <h2><i class="fas fa-compact-disc"></i> الأفلام الرائجة</h2>
                            <button class="see-more-btn" data-type="movie">المزيد <i class="fas fa-chevron-left"></i></button>
                        </div>
                        <div class="horizontal-scroll" id="rowTrendingMovies"></div>
                    </section>

                    <!-- صف المسلسلات الرائجة -->
                    <section class="content-section">
                        <div class="section-header">
                            <h2><i class="fas fa-tv"></i> المسلسلات الرائجة</h2>
                            <button class="see-more-btn" data-type="tv">المزيد <i class="fas fa-chevron-left"></i></button>
                        </div>
                        <div class="horizontal-scroll" id="rowTrendingTV"></div>
                    </section>

                    <!-- صف الأعلى تقييماً -->
                    <section class="content-section">
                        <div class="section-header">
                            <h2><i class="fas fa-crown"></i> الأعلى تقييماً</h2>
                            <button class="see-more-btn" data-type="top_rated">المزيد <i class="fas fa-chevron-left"></i></button>
                        </div>
                        <div class="horizontal-scroll" id="rowTopRated"></div>
                    </section>
                </div>

                <!-- شبكة العرض العامة (تُستخدم عند اختيار قسم معين أو عند البحث) -->
                <section class="content-section" id="fullGridSection" style="display: none;">
                    <h2 id="fullGridTitle">النتائج</h2>
                    <div class="media-grid" id="fullGrid"></div>
                </section>

            </div>
        </main>
    </div>

    <!-- مشغل الفيديو -->
    <div id="playerModal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <div class="player-layout">
                <div class="video-container">
                    <iframe id="videoPlayer" src="" frameborder="0" allowfullscreen></iframe>
                </div>
                <div class="player-sidebar">
                    <h3 id="modalMediaTitle">اسم العرض</h3>
                    <div class="control-group">
                        <label>السيرفر:</label>
                        <div class="server-buttons">
                            <button class="server-btn active" data-server="vidsrc">سيرفر 1</button>
                            <button class="server-btn" data-server="superembed">سيرفر 2</button>
                        </div>
                    </div>
                    <div id="tvControlsModal" class="control-group" style="display: none;">
                        <label>الموسم:</label>
                        <select id="modalSeasonSelect"></select>
                        <label style="margin-top: 10px;">الحلقات:</label>
                        <div class="episodes-list" id="episodesList"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
