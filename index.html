<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineMoov - سينيموف</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="app-layout">
        <!-- القائمة الجانبية (Sidebar) -->
        <aside class="sidebar">
            <div class="logo">
                <i class="fas fa-film"></i> <span>CineMoov</span>
            </div>
            
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="بحث...">
            </div>

            <nav class="nav-menu">
                <a href="#" class="nav-item active" data-type="home"><i class="fas fa-home"></i> الرئيسية</a>
                <a href="#" class="nav-item" data-type="movie"><i class="fas fa-compact-disc"></i> الأفلام</a>
                <a href="#" class="nav-item" data-type="tv"><i class="fas fa-tv"></i> المسلسلات</a>
                <a href="#" class="nav-item" data-type="anime"><i class="fas fa-mask"></i> الأنمي</a>
                <a href="#" class="nav-item" data-type="top_rated"><i class="fas fa-star"></i> الأعلى تقييماً</a>
            </nav>
        </aside>

        <!-- المحتوى الرئيسي -->
        <main class="main-content">
            
            <!-- واجهة العرض البارزة (Hero Banner) -->
            <div id="heroBanner" class="hero-banner">
                <div class="hero-overlay"></div>
                <div class="hero-info">
                    <h1 id="heroTitle">جاري التحميل...</h1>
                    <p id="heroOverview"></p>
                    <div class="hero-buttons">
                        <button id="heroPlayBtn" class="btn btn-primary"><i class="fas fa-play"></i> تشغيل الآن</button>
                    </div>
                </div>
            </div>

            <div class="sections-container" id="sectionsContainer">
                <!-- قسم تابع المشاهدة -->
                <section class="content-section" id="continueWatchingSection" style="display: none;">
                    <h2><i class="fas fa-history"></i> تابع المشاهدة</h2>
                    <div class="horizontal-scroll" id="continueWatchingGrid"></div>
                </section>

                <!-- قسم الرائج -->
                <section class="content-section">
                    <h2 id="section1Title"><i class="fas fa-fire"></i> الأفلام والمسلسلات الرائجة</h2>
                    <div class="media-grid" id="gridTrending"></div>
                </section>

                <!-- قسم الأعلى تقييماً -->
                <section class="content-section" id="topRatedSection">
                    <h2><i class="fas fa-crown"></i> الأعلى تقييماً</h2>
                    <div class="media-grid" id="gridTopRated"></div>
                </section>
            </div>
        </main>
    </div>

    <!-- مشغل الفيديو والنافذة المتقدمة -->
    <div id="playerModal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            
            <div class="player-layout">
                <!-- شاشة الفيديو -->
                <div class="video-container">
                    <iframe id="videoPlayer" src="" frameborder="0" allowfullscreen></iframe>
                </div>

                <!-- اللوحة الجانبية للتحكم بالحلقات والسيرفرات -->
                <div class="player-sidebar">
                    <h3 id="modalMediaTitle">اسم العرض</h3>
                    
                    <!-- السيرفرات -->
                    <div class="control-group">
                        <label>السيرفر:</label>
                        <div class="server-buttons">
                            <button class="server-btn active" data-server="vidsrc">سيرفر 1</button>
                            <button class="server-btn" data-server="superembed">سيرفر 2</button>
                        </div>
                    </div>

                    <!-- خيارات المسلسلات -->
                    <div id="tvControlsModal" class="control-group" style="display: none;">
                        <label>الموسم:</label>
                        <select id="modalSeasonSelect"></select>
                        
                        <label style="margin-top: 10px;">الحلقات:</label>
                        <div class="episodes-list" id="episodesList"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
