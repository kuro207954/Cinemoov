<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineMoov - Streaming Platform</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <i class="fas fa-film"></i> <span>CineMoov</span>
            </div>
            
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Search movies, series...">
            </div>

            <nav class="nav-menu">
                <a href="#" class="nav-item active" data-type="home"><i class="fas fa-home"></i> Home</a>
                <a href="#" class="nav-item" data-type="movie"><i class="fas fa-compact-disc"></i> Movies</a>
                <a href="#" class="nav-item" data-type="tv"><i class="fas fa-tv"></i> TV Series</a>
                <a href="#" class="nav-item" data-type="anime"><i class="fas fa-mask"></i> Anime</a>
            </nav>
        </aside>

        <!-- Main Workspace -->
        <main class="main-content">
            
            <!-- HOME VIEW -->
            <div id="homeView">
                <!-- Hero Banner -->
                <div id="heroBanner" class="hero-banner">
                    <div class="hero-overlay"></div>
                    <div class="hero-info">
                        <h1 id="heroTitle">Loading...</h1>
                        <p id="heroOverview"></p>
                        <div class="hero-buttons">
                            <button id="heroPlayBtn" class="btn btn-primary"><i class="fas fa-play"></i> Watch Now</button>
                        </div>
                    </div>
                </div>

                <div class="sections-container">
                    <!-- Continue Watching -->
                    <section class="content-section" id="continueWatchingSection" style="display: none;">
                        <div class="section-header">
                            <h2><i class="fas fa-history"></i> Continue Watching</h2>
                        </div>
                        <div class="horizontal-scroll" id="continueWatchingGrid"></div>
                    </section>

                    <!-- Trending Movies -->
                    <section class="content-section">
                        <div class="section-header">
                            <h2><i class="fas fa-compact-disc"></i> Trending Movies</h2>
                            <button class="see-more-btn" data-type="movie">View All <i class="fas fa-chevron-right"></i></button>
                        </div>
                        <div class="horizontal-scroll" id="rowTrendingMovies"></div>
                    </section>

                    <!-- Trending TV Series -->
                    <section class="content-section">
                        <div class="section-header">
                            <h2><i class="fas fa-tv"></i> Trending TV Series</h2>
                            <button class="see-more-btn" data-type="tv">View All <i class="fas fa-chevron-right"></i></button>
                        </div>
                        <div class="horizontal-scroll" id="rowTrendingTV"></div>
                    </section>

                    <!-- Top Rated -->
                    <section class="content-section">
                        <div class="section-header">
                            <h2><i class="fas fa-crown"></i> Top Rated</h2>
                            <button class="see-more-btn" data-type="top_rated">View All <i class="fas fa-chevron-right"></i></button>
                        </div>
                        <div class="horizontal-scroll" id="rowTopRated"></div>
                    </section>
                </div>
            </div>

            <!-- GRID / CATEGORY / SEARCH VIEW -->
            <div id="gridView" class="sections-container" style="display: none;">
                <div class="section-header" style="margin-bottom: 25px;">
                    <h2 id="gridTitle">Movies</h2>
                </div>
                <div class="media-grid" id="fullGrid"></div>
            </div>

            <!-- DEDICATED MEDIA DETAIL & PLAYER VIEW -->
            <div id="detailView" class="detail-page" style="display: none;">
                <button id="backBtn" class="back-btn"><i class="fas fa-arrow-left"></i> Back</button>
                
                <div class="detail-header" id="detailHeader">
                    <div class="detail-header-overlay"></div>
                    <div class="detail-header-content">
                        <img id="detailPoster" src="" alt="Poster" class="detail-poster">
                        <div class="detail-meta">
                            <h1 id="detailTitle">Title</h1>
                            <p id="detailOverview" class="detail-overview"></p>
                            <div class="detail-badges" id="detailBadges"></div>
                        </div>
                    </div>
                </div>

                <!-- Video Player Container -->
                <div class="player-wrapper">
                    <div class="video-container">
                        <iframe id="videoPlayer" src="" frameborder="0" allowfullscreen></iframe>
                    </div>

                    <!-- Player Options Sidebar -->
                    <div class="player-controls-panel">
                        <h3><i class="fas fa-server"></i> Select Server</h3>
                        <div class="server-grid">
                            <button class="server-btn active" data-server="vidsrc">Server 1 (Primary)</button>
                            <button class="server-btn" data-server="superembed">Server 2 (Fast)</button>
                            <button class="server-btn" data-server="autoembed">Server 3 (HD)</button>
                            <button class="server-btn" data-server="2embed">Server 4 (Backup)</button>
                        </div>

                        <div id="tvControls" class="tv-controls" style="display: none;">
                            <h3><i class="fas fa-list"></i> Episodes</h3>
                            <div class="control-group">
                                <label>Season:</label>
                                <select id="seasonSelect"></select>
                            </div>
                            <div class="episodes-grid" id="episodesList"></div>
                        </div>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
