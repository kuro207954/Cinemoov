<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineMoov - متعتك السينمائية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- الهيدر الرئيسي -->
    <header class="main-header">
        <div class="logo-container" onclick="navigateTo('#/')">
            <span class="logo-text">CineMoov</span>
            <i class="fa-solid fa-film logo-icon"></i>
        </div>

        <nav class="nav-links">
            <a href="#/" class="nav-item active" id="nav-home">الرئيسية</a>
            <a href="#/movies" class="nav-item" id="nav-movies">الأفلام</a>
            <a href="#/tv" class="nav-item" id="nav-tv">المسلسلات</a>
            <a href="#/anime" class="nav-item" id="nav-anime">الأنمي</a>
            <a href="#/search" class="nav-item search-btn" id="nav-search">
                <i class="fa-solid fa-magnifying-glass"></i> البحث
            </a>
        </nav>
    </header>

    <!-- حاوية العرض الرئيسية -->
    <main id="app-container">
        <!-- يتم تحميل كل شيء هنا ديناميكياً -->
    </main>

    <script src="script.js"></script>
</body>
</html>
